plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.gym'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    // Material Design 3 components / theme (pick one in Week 1, remove the other)
    // implementation 'io.github.mkpaz:atlantafx:2.0.1'
    // implementation 'io.github.palexdev:materialfx:11.17.0'

    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'

    // Local reusable M3 library (separated so it can be reused in many projects).
    implementation(project(':m3fx-core'))
    implementation(project(':m3fx-controls'))

    testImplementation('org.junit.jupiter:junit-jupiter:5.11.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    jvmArgs = [
        '-Xms256m',
        '-Xmx1024m',
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow'
    ]
    systemProperties System.properties
}

application {
    mainClass = 'com.gym.MainApp'
}

// Testing only: standalone window rendering EVERY m3fx component (M3Samples.java is git-ignored).
tasks.register('runSamples', JavaExec) {
    group = 'application'
    description = 'Runs the M3Samples all-components test window.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gym.M3Samples'
    jvmArgs = [
        '-Xms256m',
        '-Xmx1024m',
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow'
    ]
}

// Runs the full Gym Management System application shell with all 19 FXML screens
tasks.register('runGym', JavaExec) {
    group = 'application'
    description = 'Runs the Gym Management System full app shell.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gym.GymApp'
    jvmArgs = [
        '-Xms512m',
        '-Xmx2048m',
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow'
    ]
}
