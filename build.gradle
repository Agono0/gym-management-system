plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.gym'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls']
}

dependencies {
    // Local reusable M3 library (separated so it can be reused in many projects).
    implementation(project(':m3fx-core'))
    implementation(project(':m3fx-controls'))

    testImplementation('org.junit.jupiter:junit-jupiter:5.11.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    jvmArgs = [
        '-Xms256m',
        '-Xmx1024m',
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow'
    ]
    systemProperties System.properties
}

// Same compile discipline as the m3fx library modules: target Java 21 bytecode,
// always UTF-8 (Windows default encoding risk), and all lint warnings enabled.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:all,-processing'
    // Do not silently truncate lint output (javac's default cap is 100 warnings).
    options.compilerArgs << '-Xmaxwarns' << '10000'
}

application {
    mainClass = 'com.gym.MainApp'
}

// Testing only: standalone window rendering EVERY m3fx component (M3Samples.java is git-ignored).
tasks.register('runSamples', JavaExec) {
    group = 'application'
    description = 'Runs the M3Samples all-components test window.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gym.M3Samples'
    jvmArgs = [
        '-Xms256m',
        '-Xmx1024m',
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow'
    ]
}

// Runs the full Gym Management System application shell with all 19 Java-built screens
tasks.register('runGym', JavaExec) {
    group = 'application'
    description = 'Runs the Gym Management System full app shell.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gym.GymApp'
    jvmArgs = [
        '-Xms512m',
        '-Xmx2048m',
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow'
    ]
}
